services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aihub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-aihub}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      DB_USER: ${POSTGRES_USER:-aihub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      DB_NAME: ${POSTGRES_DB:-aihub}
      DB_HOST: db
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SYNC_SCHEDULER_ENABLED: ${SYNC_SCHEDULER_ENABLED:-true}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-24}
      SYNC_MIN_AGE_HOURS: ${SYNC_MIN_AGE_HOURS:-12}
      MCP_SYNC_ENABLED: ${MCP_SYNC_ENABLED:-true}
      MCP_SYNC_INTERVAL_HOURS: ${MCP_SYNC_INTERVAL_HOURS:-24}
      MCP_SYNC_MIN_AGE_HOURS: ${MCP_SYNC_MIN_AGE_HOURS:-12}
      MCP_CATEGORIES: ${MCP_CATEGORIES:-MCP}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  db_data:
